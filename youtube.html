<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nebula - Modern YouTube Clone with Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0a0a0a;
            --bg-secondary: #141414;
            --bg-card: #1a1a1a;
            --text-primary: #ffffff;
            --text-secondary: #b3b3b3;
            --accent: #ef4444;
            --accent-hover: #dc2626;
            --border: #2a2a2a;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            --success: #10b981;
            --error: #ef4444;
        }

        [data-theme="light"] {
            --bg-primary: #f8f9fa;
            --bg-secondary: #ffffff;
            --bg-card: #ffffff;
            --text-primary: #1a1a1a;
            --text-secondary: #666666;
            --border: #e5e5e5;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            transition: all 0.3s ease;
        }

        /* Modern Navbar */
        .navbar {
            position: sticky;
            top: 0;
            background: var(--bg-secondary);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
            padding: 12px 24px;
            z-index: 1000;
            transition: transform 0.3s ease;
        }

        .nav-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 24px;
            font-weight: 800;
            background: linear-gradient(135deg, #ef4444, #f97316);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            cursor: pointer;
        }

        .logo i {
            background: linear-gradient(135deg, #ef4444, #f97316);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            font-size: 28px;
        }

        .search-bar {
            flex: 1;
            max-width: 600px;
            margin: 0 20px;
        }

        .search-container {
            display: flex;
            align-items: center;
            background: var(--bg-primary);
            border: 1px solid var(--border);
            border-radius: 40px;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .search-container:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(239, 68, 68, 0.2);
        }

        .search-container input {
            flex: 1;
            padding: 12px 20px;
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-size: 16px;
            outline: none;
        }

        .search-container button {
            padding: 12px 20px;
            background: transparent;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.3s;
        }

        .search-container button:hover {
            color: var(--accent);
        }

        .nav-actions {
            display: flex;
            gap: 16px;
            align-items: center;
        }

        .theme-toggle, .nav-icon, .login-btn {
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-size: 20px;
            cursor: pointer;
            padding: 8px;
            border-radius: 50%;
            transition: all 0.3s;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .theme-toggle:hover, .nav-icon:hover {
            background: var(--bg-primary);
        }

        .login-btn {
            background: linear-gradient(135deg, var(--accent), var(--accent-hover));
            border-radius: 40px;
            width: auto;
            padding: 8px 20px;
            gap: 8px;
            color: white;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.4);
        }

        .user-menu {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            padding: 8px 12px;
            border-radius: 40px;
            background: var(--bg-primary);
            transition: all 0.3s;
        }

        .user-menu:hover {
            background: var(--border);
        }

        .user-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent), #f97316);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        /* Login Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(10px);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }

        .modal.active {
            display: flex;
            animation: fadeIn 0.3s ease;
        }

        .modal-content {
            background: var(--bg-card);
            border-radius: 24px;
            padding: 40px;
            max-width: 450px;
            width: 90%;
            box-shadow: var(--shadow);
            animation: slideUp 0.3s ease;
        }

        .modal-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .modal-header h2 {
            font-size: 28px;
            margin-bottom: 8px;
        }

        .modal-header p {
            color: var(--text-secondary);
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 500;
        }

        .input-group input {
            width: 100%;
            padding: 12px 16px;
            background: var(--bg-primary);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 16px;
            transition: all 0.3s;
        }

        .input-group input:focus {
            outline: none;
            border-color: var(--accent);
        }

        .modal-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, var(--accent), var(--accent-hover));
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .modal-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.4);
        }

        .switch-mode {
            text-align: center;
            margin-top: 20px;
            color: var(--text-secondary);
        }

        .switch-mode span {
            color: var(--accent);
            cursor: pointer;
            font-weight: 600;
        }

        .error-message {
            color: var(--error);
            font-size: 12px;
            margin-top: 5px;
            display: none;
        }

        /* Main Container */
        .main-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 24px;
        }

        .content-grid {
            display: grid;
            grid-template-columns: 1fr 400px;
            gap: 24px;
        }

        /* Video Player */
        .video-section {
            background: var(--bg-card);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: var(--shadow);
        }

        .player-wrapper {
            position: relative;
            width: 100%;
            background: #000;
        }

        .player-wrapper iframe {
            width: 100%;
            aspect-ratio: 16 / 9;
            border: none;
        }

        .volume-control {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(0,0,0,0.7);
            padding: 8px 12px;
            border-radius: 40px;
            display: flex;
            align-items: center;
            gap: 10px;
            backdrop-filter: blur(5px);
            z-index: 10;
        }

        .volume-control i {
            cursor: pointer;
            color: white;
        }

        .volume-slider {
            width: 80px;
            cursor: pointer;
        }

        .video-info {
            padding: 24px;
        }

        .video-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .video-stats {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 16px;
        }

        .action-buttons {
            display: flex;
            gap: 20px;
        }

        .action-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            background: transparent;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 8px 12px;
            border-radius: 40px;
            transition: all 0.3s;
        }

        .action-btn:hover {
            background: var(--bg-primary);
            color: var(--accent);
        }

        /* Video List */
        .video-list-section {
            background: var(--bg-card);
            border-radius: 20px;
            padding: 20px;
            box-shadow: var(--shadow);
        }

        .video-grid {
            display: flex;
            flex-direction: column;
            gap: 16px;
            max-height: 600px;
            overflow-y: auto;
        }

        .video-card {
            display: flex;
            gap: 12px;
            cursor: pointer;
            padding: 8px;
            border-radius: 12px;
            transition: all 0.3s;
            animation: fadeInUp 0.5s ease forwards;
            opacity: 0;
        }

        .video-card:hover {
            background: var(--bg-primary);
            transform: translateX(4px);
        }

        .thumbnail {
            position: relative;
            flex-shrink: 0;
        }

        .thumbnail img {
            width: 168px;
            height: 94px;
            object-fit: cover;
            border-radius: 12px;
        }

        .duration {
            position: absolute;
            bottom: 8px;
            right: 8px;
            background: rgba(0,0,0,0.8);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 11px;
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .content-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 768px) {
            .search-bar {
                display: none;
            }
            
            .video-title {
                font-size: 18px;
            }
            
            .thumbnail img {
                width: 120px;
                height: 68px;
            }
        }
    </style>
</head>
<body>

<div class="navbar" id="navbar">
    <div class="nav-content">
        <div class="logo" onclick="location.reload()">
            <i class="fas fa-play-circle"></i>
            <span>NEBULA</span>
        </div>
        
        <div class="search-bar">
            <div class="search-container">
                <input type="text" id="searchInput" placeholder="Search videos...">
                <button id="searchBtn"><i class="fas fa-search"></i></button>
            </div>
        </div>
        
        <div class="nav-actions">
            <button class="theme-toggle" id="themeToggle">
                <i class="fas fa-moon"></i>
            </button>
            <div id="authSection">
                <button class="login-btn" id="showLoginBtn">
                    <i class="fas fa-user"></i> Sign In
                </button>
            </div>
        </div>
    </div>
</div>

<!-- Login Modal -->
<div class="modal" id="authModal">
    <div class="modal-content">
        <div class="modal-header">
            <h2 id="modalTitle">Welcome Back</h2>
            <p id="modalSubtitle">Sign in to continue</p>
        </div>
        
        <div id="loginForm">
            <div class="input-group">
                <label>Email</label>
                <input type="email" id="loginEmail" placeholder="Enter your email">
                <div class="error-message" id="loginEmailError"></div>
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="loginPassword" placeholder="Enter your password">
                <div class="error-message" id="loginPasswordError"></div>
            </div>
            <button class="modal-btn" id="loginSubmitBtn">Sign In</button>
            <div class="switch-mode">
                Don't have an account? <span id="switchToSignup">Sign Up</span>
            </div>
        </div>
        
        <div id="signupForm" style="display: none;">
            <div class="input-group">
                <label>Username</label>
                <input type="text" id="signupUsername" placeholder="Choose a username">
                <div class="error-message" id="signupUsernameError"></div>
            </div>
            <div class="input-group">
                <label>Email</label>
                <input type="email" id="signupEmail" placeholder="Enter your email">
                <div class="error-message" id="signupEmailError"></div>
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="signupPassword" placeholder="Create a password">
                <div class="error-message" id="signupPasswordError"></div>
            </div>
            <button class="modal-btn" id="signupSubmitBtn">Create Account</button>
            <div class="switch-mode">
                Already have an account? <span id="switchToLogin">Sign In</span>
            </div>
        </div>
    </div>
</div>

<div class="main-container">
    <div class="content-grid">
        <div class="video-section">
            <div class="player-wrapper">
                <iframe id="videoFrame" 
                    src="https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=0&enablejsapi=1" 
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                    allowfullscreen>
                </iframe>
                <div class="volume-control">
                    <i class="fas fa-volume-up" id="volumeIcon"></i>
                    <input type="range" id="volumeSlider" class="volume-slider" min="0" max="100" value="50">
                </div>
            </div>
            <div class="video-info">
                <h1 class="video-title" id="videoTitle">Rick Astley - Never Gonna Give You Up</h1>
                <div class="video-stats">
                    <div class="stats-left">
                        <span id="viewsCount">1.2M views</span> • 
                        <span id="likesCount">85K likes</span>
                    </div>
                    <div class="action-buttons">
                        <button class="action-btn" id="likeBtn">
                            <i class="fas fa-thumbs-up"></i>
                            <span>Like</span>
                        </button>
                        <button class="action-btn" id="dislikeBtn">
                            <i class="fas fa-thumbs-down"></i>
                            <span>Dislike</span>
                        </button>
                        <button class="action-btn" id="shareBtn">
                            <i class="fas fa-share"></i>
                            <span>Share</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <div class="video-list-section">
            <div class="video-grid" id="videoListContainer"></div>
        </div>
    </div>
</div>

<script>
    // Video database with sound-enabled YouTube videos
    const videos = [];

    let currentVideo = null;
    let currentUser = null;
    let liked = false;
    let disliked = false;

    // User Database (localStorage)
    let users = JSON.parse(localStorage.getItem('users')) || [];

    // Volume control
    function setupVolumeControl() {
        const iframe = document.getElementById('videoFrame');
        const volumeSlider = document.getElementById('volumeSlider');
        const volumeIcon = document.getElementById('volumeIcon');
        
        // Volume control via YouTube API (simplified)
        volumeSlider.addEventListener('input', (e) => {
            const volume = e.target.value;
            if (volume == 0) {
                volumeIcon.className = 'fas fa-volume-mute';
            } else if (volume < 30) {
                volumeIcon.className = 'fas fa-volume-down';
            } else {
                volumeIcon.className = 'fas fa-volume-up';
            }
            // Note: Full volume control requires YouTube IFrame API
            // This is a UI placeholder that works visually
        });
        
        volumeIcon.addEventListener('click', () => {
            if (volumeSlider.value > 0) {
                volumeSlider.value = 0;
                volumeIcon.className = 'fas fa-volume-mute';
            } else {
                volumeSlider.value = 50;
                volumeIcon.className = 'fas fa-volume-up';
            }
        });
    }

    // Load video with sound
    function loadVideo(video) {
        currentVideo = video;
        const iframe = document.getElementById('videoFrame');
        iframe.src = video.url;
        document.getElementById('videoTitle').innerText = video.title;
        document.getElementById('viewsCount').innerText = video.views;
        document.getElementById('likesCount').innerText = video.likes + ' likes';
        
        liked = false;
        disliked = false;
        updateLikeDislikeUI();
        
        window.history.pushState({ videoId: video.id }, '', `#video=${video.id}`);
        
        if (window.innerWidth < 768) {
            document.querySelector('.video-section').scrollIntoView({ behavior: 'smooth' });
        }
    }

    // Render video list
    function renderVideoList(filteredVideos = videos) {
        const container = document.getElementById('videoListContainer');
        container.innerHTML = '';
        
        filteredVideos.forEach((video, index) => {
            const videoCard = document.createElement('div');
            videoCard.className = 'video-card';
            videoCard.style.animationDelay = `${index * 0.05}s`;
            videoCard.innerHTML = `
                <div class="thumbnail">
                    <img src="${video.thumbnail}" alt="${video.title}" loading="lazy">
                    <span class="duration">${video.duration}</span>
                </div>
                <div class="card-info">
                    <h4>${video.title.length > 50 ? video.title.substring(0, 50) + '...' : video.title}</h4>
                    <p>${video.views} • ${Math.floor(Math.random() * 30)} days ago</p>
                </div>
            `;
            videoCard.addEventListener('click', () => loadVideo(video));
            container.appendChild(videoCard);
        });
    }

    function updateLikeDislikeUI() {
        const likeBtn = document.getElementById('likeBtn');
        const dislikeBtn = document.getElementById('dislikeBtn');
        
        if (liked) {
            likeBtn.style.color = '#ef4444';
            likeBtn.querySelector('span').style.color = '#ef4444';
        } else {
            likeBtn.style.color = 'var(--text-secondary)';
            likeBtn.querySelector('span').style.color = 'var(--text-secondary)';
        }
        
        if (disliked) {
            dislikeBtn.style.color = '#ef4444';
            dislikeBtn.querySelector('span').style.color = '#ef4444';
        } else {
            dislikeBtn.style.color = 'var(--text-secondary)';
            dislikeBtn.querySelector('span').style.color = 'var(--text-secondary)';
        }
    }

    // Auth Functions
    function showLoginModal() {
        document.getElementById('authModal').classList.add('active');
        document.getElementById('loginForm').style.display = 'block';
        document.getElementById('signupForm').style.display = 'none';
        document.getElementById('modalTitle').innerText = 'Welcome Back';
        document.getElementById('modalSubtitle').innerText = 'Sign in to continue';
    }

    function hideLoginModal() {
        document.getElementById('authModal').classList.remove('active');
    }

    function updateAuthUI() {
        const authSection = document.getElementById('authSection');
        if (currentUser) {
            authSection.innerHTML = `
                <div class="user-menu" id="userMenu">
                    <div class="user-avatar">${currentUser.username[0].toUpperCase()}</div>
                    <span>${currentUser.username}</span>
                    <i class="fas fa-chevron-down"></i>
                </div>
            `;
            document.getElementById('userMenu').addEventListener('click', () => {
                if (confirm('Sign out?')) {
                    currentUser = null;
                    updateAuthUI();
                }
            });
        } else {
            authSection.innerHTML = `
                <button class="login-btn" id="showLoginBtn">
                    <i class="fas fa-user"></i> Sign In
                </button>
            `;
            document.getElementById('showLoginBtn').addEventListener('click', showLoginModal);
        }
    }

    function handleSignup() {
        const username = document.getElementById('signupUsername').value;
        const email = document.getElementById('signupEmail').value;
        const password = document.getElementById('signupPassword').value;
        
        let isValid = true;
        
        if (!username) {
            document.getElementById('signupUsernameError').innerText = 'Username required';
            document.getElementById('signupUsernameError').style.display = 'block';
            isValid = false;
        }
        
        if (!email || !email.includes('@')) {
            document.getElementById('signupEmailError').innerText = 'Valid email required';
            document.getElementById('signupEmailError').style.display = 'block';
            isValid = false;
        }
        
        if (!password || password.length < 6) {
            document.getElementById('signupPasswordError').innerText = 'Password must be at least 6 characters';
            document.getElementById('signupPasswordError').style.display = 'block';
            isValid = false;
        }
        
        if (isValid && !users.find(u => u.email === email)) {
            const newUser = { username, email, password, likedVideos: [] };
            users.push(newUser);
            localStorage.setItem('users', JSON.stringify(users));
            currentUser = newUser;
            updateAuthUI();
            hideLoginModal();
            alert('Account created successfully!');
        } else if (users.find(u => u.email === email)) {
            alert('Email already exists!');
        }
    }

    function handleLogin() {
        const email = document.getElementById('loginEmail').value;
        const password = document.getElementById('loginPassword').value;
        
        const user = users.find(u => u.email === email && u.password === password);
        
        if (user) {
            currentUser = user;
            updateAuthUI();
            hideLoginModal();
            alert(`Welcome back, ${user.username}!`);
        } else {
            alert('Invalid email or password!');
        }
    }

    // Search
    function searchVideos() {
        const searchTerm = document.getElementById('searchInput').value.toLowerCase();
        const filtered = videos.filter(video => 
            video.title.toLowerCase().includes(searchTerm)
        );
        renderVideoList(filtered);
    }

    // Share functionality
    document.getElementById('shareBtn')?.addEventListener('click', () => {
        const url = window.location.href;
        navigator.clipboard.writeText(url);
        alert('Link copied to clipboard!');
    });

    // Event Listeners
    document.getElementById('likeBtn').addEventListener('click', () => {
        if (!currentUser) {
            alert('Please login to like videos!');
            showLoginModal();
            return;
        }
        liked = !liked;
        if (liked && disliked) disliked = false;
        updateLikeDislikeUI();
    });
    
    document.getElementById('dislikeBtn').addEventListener('click', () => {
        if (!currentUser) {
            alert('Please login to dislike videos!');
            showLoginModal();
            return;
        }
        disliked = !disliked;
        if (disliked && liked) liked = false;
        updateLikeDislikeUI();
    });
    
    document.getElementById('searchBtn').addEventListener('click', searchVideos);
    document.getElementById('searchInput').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') searchVideos();
    });
    
    document.getElementById('switchToSignup')?.addEventListener('click', () => {
        document.getElementById('loginForm').style.display = 'none';
        document.getElementById('signupForm').style.display = 'block';
        document.getElementById('modalTitle').innerText = 'Create Account';
        document.getElementById('modalSubtitle').innerText = 'Join Nebula today';
    });
    
    document.getElementById('switchToLogin')?.addEventListener('click', () => {
        document.getElementById('loginForm').style.display = 'block';
        document.getElementById('signupForm').style.display = 'none';
        document.getElementById('modalTitle').innerText = 'Welcome Back';
        document.getElementById('modalSubtitle').innerText = 'Sign in to continue';
    });
    
    document.getElementById('loginSubmitBtn')?.addEventListener('click', handleLogin);
    document.getElementById('signupSubmitBtn')?.addEventListener('click', handleSignup);
    
    // Close modal on outside click
    document.getElementById('authModal').addEventListener('click', (e) => {
        if (e.target === document.getElementById('authModal')) {
            hideLoginModal();
        }
    });

    // Theme toggle
    function initTheme() {
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'light') {
            document.body.setAttribute('data-theme', 'light');
            document.getElementById('themeToggle').innerHTML = '<i class="fas fa-sun"></i>';
        }
    }
    
    document.getElementById('themeToggle').addEventListener('click', () => {
        const currentTheme = document.body.getAttribute('data-theme');
        if (currentTheme === 'dark') {
            document.body.setAttribute('data-theme', 'light');
            localStorage.setItem('theme', 'light');
            document.getElementById('themeToggle').innerHTML = '<i class="fas fa-sun"></i>';
        } else {
            document.body.setAttribute('data-theme', 'dark');
            localStorage.setItem('theme', 'dark');
            document.getElementById('themeToggle').innerHTML = '<i class="fas fa-moon"></i>';
        }
    });

    // Auto-hide navbar
    let lastScroll = 0;
    window.addEventListener('scroll', () => {
        const navbar = document.getElementById('navbar');
        const currentScroll = window.pageYOffset;
        if (currentScroll > lastScroll && currentScroll > 100) {
            navbar.style.transform = 'translateY(-100%)';
        } else {
            navbar.style.transform = 'translateY(0)';
        }
        lastScroll = currentScroll;
    });

    // Initialize
    initTheme();
    renderVideoList();
    setupVolumeControl();
    updateAuthUI();
    
    // Handle browser back/forward
    window.addEventListener('popstate', (event) => {
        const videoId = event.state?.videoId;
        const video = videos.find(v => v.id === videoId);
        if (video) loadVideo(video);
    });
</script>

</body>
</html>

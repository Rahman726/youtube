<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Channel YouTube Aggregator</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0a0a0a;
            --bg-secondary: #141414;
            --bg-card: #1a1a1a;
            --text-primary: #ffffff;
            --text-secondary: #b3b3b3;
            --accent: #ef4444;
            --accent-hover: #dc2626;
            --border: #2a2a2a;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            --success: #10b981;
            --error: #ef4444;
        }

        [data-theme="light"] {
            --bg-primary: #f8f9fa;
            --bg-secondary: #ffffff;
            --bg-card: #ffffff;
            --text-primary: #1a1a1a;
            --text-secondary: #666666;
            --border: #e5e5e5;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            transition: all 0.3s ease;
            min-height: 100vh;
        }

        /* Modern Navbar */
        .navbar {
            position: sticky;
            top: 0;
            background: var(--bg-secondary);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
            padding: 12px 24px;
            z-index: 1000;
            transition: transform 0.3s ease;
        }

        .nav-content {
            max-width: 1600px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 24px;
            font-weight: 800;
            background: linear-gradient(135deg, #ef4444, #f97316);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            cursor: pointer;
        }

        .logo i {
            font-size: 28px;
            background: linear-gradient(135deg, #ef4444, #f97316);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .search-bar {
            flex: 1;
            max-width: 600px;
            min-width: 200px;
        }

        .search-container {
            display: flex;
            align-items: center;
            background: var(--bg-primary);
            border: 1px solid var(--border);
            border-radius: 40px;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .search-container:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(239, 68, 68, 0.2);
        }

        .search-container input {
            flex: 1;
            padding: 12px 20px;
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-size: 16px;
            outline: none;
        }

        .search-container button {
            padding: 12px 20px;
            background: transparent;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.3s;
        }

        .search-container button:hover {
            color: var(--accent);
        }

        .nav-actions {
            display: flex;
            gap: 16px;
            align-items: center;
        }

        .theme-toggle, .refresh-btn {
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-size: 20px;
            cursor: pointer;
            padding: 8px;
            border-radius: 50%;
            transition: all 0.3s;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .theme-toggle:hover, .refresh-btn:hover {
            background: var(--bg-primary);
        }

        .refresh-btn.spinning {
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Main Container */
        .main-container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 24px;
        }

        /* Video Grid Layout */
        .content-grid {
            display: grid;
            grid-template-columns: 1fr 400px;
            gap: 24px;
        }

        /* Video Player Section */
        .video-section {
            background: var(--bg-card);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: var(--shadow);
            position: sticky;
            top: 80px;
            height: fit-content;
        }

        .player-wrapper {
            position: relative;
            width: 100%;
            background: #000;
        }

        .player-wrapper iframe {
            width: 100%;
            aspect-ratio: 16 / 9;
            border: none;
        }

        .player-placeholder {
            width: 100%;
            aspect-ratio: 16 / 9;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1a1a1a, #2a2a2a);
            color: var(--text-secondary);
            font-size: 18px;
            flex-direction: column;
            gap: 16px;
        }

        .player-placeholder i {
            font-size: 64px;
            color: var(--accent);
        }

        .video-info {
            padding: 24px;
        }

        .video-title {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 12px;
            line-height: 1.4;
        }

        .video-channel {
            color: var(--accent);
            font-weight: 600;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .video-stats {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .stats-left {
            color: var(--text-secondary);
            font-size: 14px;
        }

        .action-buttons {
            display: flex;
            gap: 12px;
        }

        .action-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--bg-primary);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            cursor: pointer;
            padding: 10px 16px;
            border-radius: 40px;
            transition: all 0.3s;
            font-size: 14px;
        }

        .action-btn:hover {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        /* Channel Filter */
        .channel-filter {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            overflow-x: auto;
            padding-bottom: 8px;
        }

        .channel-btn {
            padding: 10px 20px;
            background: var(--bg-card);
            border: 2px solid var(--border);
            border-radius: 30px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
            font-weight: 500;
            white-space: nowrap;
        }

        .channel-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .channel-btn.active {
            background: var(--accent);
            border-color: var(--accent);
            color: white;
        }

        /* Video List Section */
        .video-list-section {
            background: var(--bg-card);
            border-radius: 20px;
            padding: 20px;
            box-shadow: var(--shadow);
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .section-title {
            font-size: 18px;
            font-weight: 600;
        }

        .video-count {
            color: var(--text-secondary);
            font-size: 14px;
        }

        .video-grid-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
            max-height: calc(100vh - 300px);
            overflow-y: auto;
        }

        .video-card {
            display: flex;
            gap: 12px;
            cursor: pointer;
            padding: 10px;
            border-radius: 12px;
            transition: all 0.3s;
            animation: fadeInUp 0.5s ease forwards;
            opacity: 0;
        }

        .video-card:hover {
            background: var(--bg-primary);
            transform: translateX(4px);
        }

        .video-card.active {
            background: var(--bg-primary);
            border: 2px solid var(--accent);
        }

        .thumbnail {
            position: relative;
            flex-shrink: 0;
        }

        .thumbnail img {
            width: 168px;
            height: 94px;
            object-fit: cover;
            border-radius: 12px;
        }

        .duration {
            position: absolute;
            bottom: 8px;
            right: 8px;
            background: rgba(0,0,0,0.8);
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
        }

        .card-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 6px;
        }

        .card-info h4 {
            font-size: 15px;
            font-weight: 500;
            line-height: 1.4;
            display: -webkit-box;
            display: box;
            -webkit-line-clamp: 2;
            line-clamp: 2;
            -webkit-box-orient: vertical;
            box-orient: vertical;
            overflow: hidden;
        }

        .card-info .channel-name {
            color: var(--accent);
            font-size: 13px;
            font-weight: 500;
        }

        .card-info .meta {
            color: var(--text-secondary);
            font-size: 12px;
        }

        /* Pagination */
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 16px;
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid var(--border);
        }

        .pagination button {
            padding: 10px 24px;
            background: var(--accent);
            border: none;
            border-radius: 30px;
            color: white;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        .pagination button:hover:not(:disabled) {
            background: var(--accent-hover);
            transform: translateY(-2px);
        }

        .pagination button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .pagination .page-info {
            color: var(--text-secondary);
        }

        /* Loading State */
        .loading-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        .error-container {
            text-align: center;
            padding: 60px 20px;
            color: var(--error);
        }

        .error-container i {
            font-size: 48px;
            margin-bottom: 16px;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }

        .empty-state i {
            font-size: 64px;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Responsive */
        @media (max-width: 1200px) {
            .content-grid {
                grid-template-columns: 1fr;
            }

            .video-section {
                position: static;
            }

            .video-grid-list {
                max-height: none;
            }
        }

        @media (max-width: 768px) {
            .nav-content {
                flex-direction: column;
            }

            .search-bar {
                max-width: 100%;
                width: 100%;
                order: 3;
            }

            .thumbnail img {
                width: 140px;
                height: 78px;
            }

            .video-title {
                font-size: 18px;
            }
        }

        /* Scrollbar Styling */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-primary);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent);
        }

        /* Stats Panel */
        .stats-panel {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 16px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            text-align: center;
        }

        .stat-card i {
            font-size: 24px;
            color: var(--accent);
            margin-bottom: 8px;
        }

        .stat-card .number {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .stat-card .label {
            font-size: 12px;
            color: var(--text-secondary);
        }
    </style>
</head>
<body>

<div class="navbar" id="navbar">
    <div class="nav-content">
        <div class="logo" onclick="location.reload()">
            <i class="fas fa-play-circle"></i>
            <span>Multi-Channel Hub</span>
        </div>
        
        <div class="search-bar">
            <div class="search-container">
                <input type="text" id="searchInput" placeholder="Search all videos...">
                <button id="searchBtn"><i class="fas fa-search"></i></button>
            </div>
        </div>
        
        <div class="nav-actions">
            <button class="refresh-btn" id="refreshBtn" title="Refresh Videos">
                <i class="fas fa-sync-alt"></i>
            </button>
            <button class="theme-toggle" id="themeToggle">
                <i class="fas fa-moon"></i>
            </button>
        </div>
    </div>
</div>

<div class="main-container">
    <!-- Stats Panel -->
    <div class="stats-panel" id="statsPanel">
        <div class="stat-card">
            <i class="fas fa-video"></i>
            <div class="number" id="totalVideos">0</div>
            <div class="label">Total Videos</div>
        </div>
        <div class="stat-card">
            <i class="fas fa-tv"></i>
            <div class="number" id="totalChannels">0</div>
            <div class="label">Channels</div>
        </div>
        <div class="stat-card">
            <i class="fas fa-eye"></i>
            <div class="number" id="totalViews">0</div>
            <div class="label">Total Views</div>
        </div>
        <div class="stat-card">
            <i class="fas fa-clock"></i>
            <div class="number" id="lastUpdated">Just now</div>
            <div class="label">Last Updated</div>
        </div>
    </div>

    <!-- Channel Filter -->
    <div class="channel-filter" id="channelFilter">
        <button class="channel-btn active" data-channel="all">All Channels</button>
    </div>

    <div class="content-grid">
        <!-- Video Player Section -->
        <div class="video-section">
            <div class="player-wrapper">
                <div class="player-placeholder" id="playerPlaceholder">
                    <i class="fas fa-play-circle"></i>
                    <span>Select a video to play</span>
                </div>
                <iframe id="videoFrame" style="display: none;" 
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                    allowfullscreen>
                </iframe>
            </div>
            <div class="video-info">
                <h1 class="video-title" id="videoTitle">Welcome to Multi-Channel Hub</h1>
                <div class="video-channel" id="videoChannel">
                    <i class="fas fa-tv"></i>
                    <span>Select a channel</span>
                </div>
                <div class="video-stats">
                    <div class="stats-left">
                        <span id="viewsCount">- views</span> • 
                        <span id="likesCount">- likes</span> • 
                        <span id="publishedDate">-</span>
                    </div>
                    <div class="action-buttons">
                        <button class="action-btn" id="likeBtn">
                            <i class="fas fa-thumbs-up"></i>
                            <span>Like</span>
                        </button>
                        <button class="action-btn" id="shareBtn">
                            <i class="fas fa-share"></i>
                            <span>Share</span>
                        </button>
                        <button class="action-btn" id="openYoutubeBtn">
                            <i class="fab fa-youtube"></i>
                            <span>Open in YouTube</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Video List Section -->
        <div class="video-list-section">
            <div class="section-header">
                <h3 class="section-title">All Videos</h3>
                <span class="video-count" id="videoCount">Loading...</span>
            </div>
            
            <div class="video-grid-list" id="videoListContainer">
                <div class="loading-container">
                    <div class="spinner"></div>
                    <p>Loading videos from all channels...</p>
                </div>
            </div>

            <div class="pagination" id="pagination" style="display: none;">
                <button id="prevPage" disabled><i class="fas fa-chevron-left"></i> Previous</button>
                <span class="page-info">Page <span id="currentPage">1</span> of <span id="totalPages">1</span></span>
                <button id="nextPage">Next <i class="fas fa-chevron-right"></i></button>
            </div>
        </div>
    </div>
</div>

<script>
    // Configuration
    const API_BASE_URL = window.location.origin;
    const ITEMS_PER_PAGE = 15;

    // State
    let currentVideos = [];
    let channels = [];
    let currentPage = 1;
    let totalPages = 1;
    let selectedChannel = 'all';
    let searchQuery = '';
    let currentVideo = null;

    // DOM Elements
    const videoListContainer = document.getElementById('videoListContainer');
    const channelFilter = document.getElementById('channelFilter');
    const videoFrame = document.getElementById('videoFrame');
    const playerPlaceholder = document.getElementById('playerPlaceholder');
    const videoTitle = document.getElementById('videoTitle');
    const videoChannel = document.getElementById('videoChannel');
    const viewsCount = document.getElementById('viewsCount');
    const likesCount = document.getElementById('likesCount');
    const publishedDate = document.getElementById('publishedDate');
    const searchInput = document.getElementById('searchInput');
    const searchBtn = document.getElementById('searchBtn');
    const refreshBtn = document.getElementById('refreshBtn');
    const pagination = document.getElementById('pagination');
    const prevPageBtn = document.getElementById('prevPage');
    const nextPageBtn = document.getElementById('nextPage');
    const currentPageSpan = document.getElementById('currentPage');
    const totalPagesSpan = document.getElementById('totalPages');

    // Initialize
    async function init() {
        initTheme();
        await loadChannels();
        await loadVideos();
        setupEventListeners();
    }

    // Load channels
    async function loadChannels() {
        try {
            const response = await fetch(`${API_BASE_URL}/api/channels`);
            channels = await response.json();
            
            // Update channel filter buttons
            channels.forEach(channel => {
                const btn = document.createElement('button');
                btn.className = 'channel-btn';
                btn.dataset.channel = channel.title;
                btn.textContent = channel.title;
                channelFilter.appendChild(btn);
            });

            // Update stats
            document.getElementById('totalChannels').textContent = channels.length;
        } catch (error) {
            console.error('Error loading channels:', error);
        }
    }

    // Load videos
    async function loadVideos() {
        try {
            showLoading();
            
            const params = new URLSearchParams({
                page: currentPage,
                limit: ITEMS_PER_PAGE
            });

            if (selectedChannel !== 'all') {
                params.append('channel', selectedChannel);
            }

            if (searchQuery) {
                params.append('search', searchQuery);
            }

            const response = await fetch(`${API_BASE_URL}/api/videos?${params}`);
            const data = await response.json();
            
            currentVideos = data.videos;
            totalPages = data.totalPages;
            
            renderVideos();
            updatePagination();
            updateStats(data.total);
            
        } catch (error) {
            console.error('Error loading videos:', error);
            showError('Failed to load videos. Please try again.');
        }
    }

    // Render videos
    function renderVideos() {
        videoListContainer.innerHTML = '';
        
        if (currentVideos.length === 0) {
            videoListContainer.innerHTML = `
                <div class="empty-state">
                    <i class="fas fa-inbox"></i>
                    <h3>No videos found</h3>
                    <p>Try a different search or check back later</p>
                </div>
            `;
            pagination.style.display = 'none';
            return;
        }

        currentVideos.forEach((video, index) => {
            const card = document.createElement('div');
            card.className = 'video-card';
            card.style.animationDelay = `${index * 0.03}s`;
            
            if (currentVideo && currentVideo.id === video.id) {
                card.classList.add('active');
            }

            card.innerHTML = `
                <div class="thumbnail">
                    <img src="${video.thumbnail}" alt="${video.title}" loading="lazy">
                    ${video.duration && video.duration !== 'N/A' ? `<span class="duration">${formatDuration(video.duration)}</span>` : ''}
                </div>
                <div class="card-info">
                    <h4>${video.title}</h4>
                    <div class="channel-name">${video.channelName}</div>
                    <div class="meta">${video.views || '0 views'} • ${formatDate(video.publishedAt)}</div>
                </div>
            `;

            card.addEventListener('click', () => playVideo(video));
            videoListContainer.appendChild(card);
        });

        document.getElementById('videoCount').textContent = `${currentVideos.length} videos`;
    }

    // Play video
    function playVideo(video) {
        currentVideo = video;
        
        // Show iframe, hide placeholder
        playerPlaceholder.style.display = 'none';
        videoFrame.style.display = 'block';
        videoFrame.src = video.url;
        
        // Update info
        videoTitle.textContent = video.title;
        videoChannel.innerHTML = `<i class="fas fa-tv"></i> ${video.channelName}`;
        viewsCount.textContent = video.views || '0 views';
        likesCount.textContent = `${video.likes || '0'} likes`;
        publishedDate.textContent = formatDate(video.publishedAt);
        
        // Highlight active card
        document.querySelectorAll('.video-card').forEach(card => {
            card.classList.remove('active');
        });
        event.currentTarget?.classList?.add('active');
        
        // Scroll to top on mobile
        if (window.innerWidth <= 1200) {
            document.querySelector('.video-section').scrollIntoView({ behavior: 'smooth' });
        }
    }

    // Setup event listeners
    function setupEventListeners() {
        // Channel filter
        channelFilter.addEventListener('click', (e) => {
            if (e.target.classList.contains('channel-btn')) {
                document.querySelectorAll('.channel-btn').forEach(btn => btn.classList.remove('active'));
                e.target.classList.add('active');
                selectedChannel = e.target.dataset.channel;
                currentPage = 1;
                loadVideos();
            }
        });

        // Search
        searchBtn.addEventListener('click', () => {
            searchQuery = searchInput.value;
            currentPage = 1;
            loadVideos();
        });

        searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                searchQuery = searchInput.value;
                currentPage = 1;
                loadVideos();
            }
        });

        // Pagination
        prevPageBtn.addEventListener('click', () => {
            if (currentPage > 1) {
                currentPage--;
                loadVideos();
            }
        });

        nextPageBtn.addEventListener('click', () => {
            if (currentPage < totalPages) {
                currentPage++;
                loadVideos();
            }
        });

        // Refresh
        refreshBtn.addEventListener('click', async () => {
            refreshBtn.classList.add('spinning');
            try {
                await fetch(`${API_BASE_URL}/api/refresh`, { method: 'POST' });
                await loadVideos();
            } catch (error) {
                console.error('Error refreshing:', error);
            } finally {
                refreshBtn.classList.remove('spinning');
            }
        });

        // Share button
        document.getElementById('shareBtn').addEventListener('click', () => {
            if (currentVideo) {
                const url = `https://youtube.com/watch?v=${currentVideo.id}`;
                navigator.clipboard.writeText(url);
                alert('Link copied to clipboard!');
            }
        });

        // Open in YouTube
        document.getElementById('openYoutubeBtn').addEventListener('click', () => {
            if (currentVideo) {
                window.open(`https://youtube.com/watch?v=${currentVideo.id}`, '_blank');
            }
        });

        // Theme toggle
        document.getElementById('themeToggle').addEventListener('click', toggleTheme);

        // Like button (visual only)
        document.getElementById('likeBtn').addEventListener('click', function() {
            this.style.background = this.style.background === 'var(--accent)' ? '' : 'var(--accent)';
            this.style.color = this.style.color === 'white' ? '' : 'white';
        });
    }

    // Update pagination
    function updatePagination() {
        currentPageSpan.textContent = currentPage;
        totalPagesSpan.textContent = totalPages;
        prevPageBtn.disabled = currentPage === 1;
        nextPageBtn.disabled = currentPage === totalPages;
        pagination.style.display = totalPages > 1 ? 'flex' : 'none';
    }

    // Update stats
    function updateStats(total) {
        document.getElementById('totalVideos').textContent = total;
    }

    // Show loading
    function showLoading() {
        videoListContainer.innerHTML = `
            <div class="loading-container">
                <div class="spinner"></div>
                <p>Loading videos...</p>
            </div>
        `;
    }

    // Show error
    function showError(message) {
        videoListContainer.innerHTML = `
            <div class="error-container">
                <i class="fas fa-exclamation-circle"></i>
                <h3>${message}</h3>
            </div>
        `;
    }

    // Format duration (PT4M13S -> 4:13)
    function formatDuration(duration) {
        if (!duration || duration === 'N/A') return '';
        const match = duration.match(/PT(\d+H)?(\d+M)?(\d+S)?/);
        if (!match) return '';
        
        const hours = (match[1] || '').replace('H', '');
        const minutes = (match[2] || '').replace('M', '');
        const seconds = (match[3] || '').replace('S', '');
        
        let result = '';
        if (hours) result += hours + ':';
        result += minutes.padStart(2, '0') + ':';
        result += seconds.padStart(2, '0');
        
        return result;
    }

    // Format date
    function formatDate(dateString) {
        if (!dateString) return '-';
        const date = new Date(dateString);
        const now = new Date();
        const diff = (now - date) / 1000;
        
        if (diff < 60) return 'Just now';
        if (diff < 3600) return `${Math.floor(diff / 60)} minutes ago`;
        if (diff < 86400) return `${Math.floor(diff / 3600)} hours ago`;
        if (diff < 604800) return `${Math.floor(diff / 86400)} days ago`;
        if (diff < 2592000) return `${Math.floor(diff / 604800)} weeks ago`;
        if (diff < 31536000) return `${Math.floor(diff / 2592000)} months ago`;
        return `${Math.floor(diff / 31536000)} years ago`;
    }

    // Theme functions
    function initTheme() {
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'light') {
            document.body.setAttribute('data-theme', 'light');
            document.getElementById('themeToggle').innerHTML = '<i class="fas fa-sun"></i>';
        }
    }

    function toggleTheme() {
        const currentTheme = document.body.getAttribute('data-theme');
        if (currentTheme === 'light') {
            document.body.setAttribute('data-theme', 'dark');
            localStorage.setItem('theme', 'dark');
            document.getElementById('themeToggle').innerHTML = '<i class="fas fa-moon"></i>';
        } else {
            document.body.setAttribute('data-theme', 'light');
            localStorage.setItem('theme', 'light');
            document.getElementById('themeToggle').innerHTML = '<i class="fas fa-sun"></i>';
        }
    }

    // Navbar scroll behavior
    let lastScroll = 0;
    window.addEventListener('scroll', () => {
        const navbar = document.getElementById('navbar');
        const currentScroll = window.pageYOffset;
        if (currentScroll > lastScroll && currentScroll > 100) {
            navbar.style.transform = 'translateY(-100%)';
        } else {
            navbar.style.transform = 'translateY(0)';
        }
        lastScroll = currentScroll;
    });

    // Start
    init();
</script>

</body>
</html>
